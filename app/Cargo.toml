[package]
name = "app"
description = "Desktop application (Bevy + egui) for the Natural Selection Simulator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# egui is listed directly so the pinned version in [workspace.dependencies] is enforced;
# bevy_egui and egui_plot must resolve to this same single egui version.
# The Bevy binary has no tests of its own; skipping its test harness avoids a second
# ~1 GB Bevy link during `cargo test`, which exhausted WSL2 memory. All testable app
# logic is in the library.
[[bin]]
name = "app"
path = "src/main.rs"
test = false

[dependencies]
sim.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
egui.workspace = true
egui_plot.workspace = true

# T-DET-4 compares the stepping driver with the `headless run` path. Test-only, so
# `headless` itself never depends on `app` or Bevy.
[dev-dependencies]
headless.workspace = true
